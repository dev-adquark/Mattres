name: Mattress Match Score CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoring-engine:
    name: Scoring engine and data checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify-catalog

  next-app:
    name: Next.js app tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-version/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
