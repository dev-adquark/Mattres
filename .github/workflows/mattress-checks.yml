name: Mattress app checks

on:
  pull_request:
    paths:
      - 'react-version/**'
      - '.github/workflows/mattress-checks.yml'
  push:
    branches: [main]
    paths:
      - 'react-version/**'
      - '.github/workflows/mattress-checks.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-version
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-version/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
